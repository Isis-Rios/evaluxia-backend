version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# EvalUXIA — Docker Compose (Development)
#
# Services:
#   evaluxia_backend  → Node.js + Express + TypeScript API
#   mongo             → MongoDB 7 database
#   mongo-express     → Web UI for MongoDB (http://localhost:8081)
#
# Usage:
#   docker-compose up -d          → Start all services
#   docker-compose logs -f api    → Follow API logs
#   docker-compose down -v        → Stop and remove volumes
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ─── EvalUXIA API ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder          # Use builder stage in dev (ts-node-dev)
    container_name: evaluxia_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/evaluxia
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      # Mount source for hot-reload with ts-node-dev
      - .:/app
      - /app/node_modules          # Preserve container node_modules
    command: npm run dev
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - evaluxia_net

  # ─── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: evaluxia_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: evaluxia
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - evaluxia_net

  # ─── Mongo Express (DB Web UI) ───────────────────────────────────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: evaluxia_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - evaluxia_net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  evaluxia_net:
    driver: bridge
