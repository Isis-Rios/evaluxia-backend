<!DOCTYPE html>
<!--
  Fase C — T7. Propósito: DOM con 8 ramas estructuralmente IDÉNTICAS (5
  niveles de <div class="wrap"> anidados, cada una con un único <a> al
  fondo) — el peor caso real para un selector basado en posición: cada
  nivel intermedio es hijo único de su padre (bare "div" con el algoritmo
  actual), y solo el nivel más externo distingue las 8 ramas entre sí.
  Mide el costo REAL en caracteres/tokens de generar selectores únicos
  verificados (Fase 2.2.1) frente al algoritmo anterior (que habría dado el
  mismo selector ambiguo "a" a las 8 ramas).
-->
