<!DOCTYPE html>
<!--
  Fase D — D2. Propósito: 3 secciones <nav> estructuralmente idénticas,
  cada una con 2 enlaces — el mismo patrón de ambigüedad potencial que el
  incidente original (múltiples elementos con estructura repetida), ahora
  usado para validar trazabilidad: cada selector generado debe resolver a
  exactamente 1 elemento real, verificable en tiempo de ejecución, y ser
  estable entre 2 capturas del mismo DOM sin cambios.
-->
<html lang="es">
<head><meta charset="utf-8" /></head>
<body>
  <h1>Portal</h1>
  <nav data-t="nav1">
    <a href="/nav1/inicio" data-t="n1a">Inicio</a>
    <a href="/nav1/contacto" data-t="n1b">Contacto</a>
  </nav>
  <nav data-t="nav2">
    <a href="/nav2/inicio" data-t="n2a">Inicio</a>
    <a href="/nav2/contacto" data-t="n2b">Contacto</a>
  </nav>
  <nav data-t="nav3">
    <a href="/nav3/inicio" data-t="n3a">Inicio</a>
    <a href="/nav3/contacto" data-t="n3b">Contacto</a>
  </nav>
</body>
</html>
