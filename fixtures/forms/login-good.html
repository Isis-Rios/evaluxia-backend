<!DOCTYPE html>
<!--
  Fase B — P0. Propósito: fixture "control" (0 defectos intencionales),
  baseline de calidad para confirmar que EvalUXIA NO genera falsos positivos
  sobre una página bien implementada.
-->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <style>
    body { background-color: #ffffff; color: #111111; font-family: sans-serif; }
    input, label, button, h1 { background-color: #ffffff; color: #111111; }
    button { background-color: #0b5fa5; color: #ffffff; padding: 8px 16px; border: none; }
  </style>
</head>
<body>
  <h1>Iniciar sesión</h1>
  <form>
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" name="email" required />
    <label for="password">Contraseña</label>
    <input id="password" type="password" name="password" required />
    <button type="submit">Iniciar sesión</button>
  </form>
</body>
</html>
